services:
  bigdata:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: bigdata_riesgo_crediticio
    hostname: bigdata
    ports:
      - "9870:9870"
      - "9000:9000"
      - "4040:4040"
    volumes:
      - .:/workspace
      - hdfs_namenode:/hadoop/dfs/name
      - hdfs_datanode:/hadoop/dfs/data
    working_dir: /workspace
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      SPARK_LOCAL_IP: 127.0.0.1

volumes:
  hdfs_namenode:
  hdfs_datanode:
